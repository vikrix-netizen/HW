
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Heart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    background: #030006;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    text-align: center;
    position: relative;
    z-index: 2;
}

.heart {
    font-size: 180px;
    color: #ff00e6;
    animation: heartbeat 1.2s infinite;
    filter:
        drop-shadow(0 0 15px #ee70e8)
        drop-shadow(0 0 40px #16b9ff)
        drop-shadow(0 0 80px #f412ed);
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }
    15% {
        transform: scale(1.18);
    }
    30% {
        transform: scale(1);
    }
    45% {
        transform: scale(1.12);
    }
    60% {
        transform: scale(1);
    }
}

h1 {
    margin-top: 30px;
    font-size: 28px;
    letter-spacing: 8px;
    color: #ff75c8;
    text-shadow: 0 0 20px #ff168f;
}

p {
    margin-top: 15px;
    color: #a98bbf;
    letter-spacing: 4px;
    font-size: 12px;
}

.particle {
    position: absolute;
    bottom: -20px;
    background: #05c8f8;
    border-radius: 50%;
    box-shadow: 0 0 15px #ff168f;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="heart">♥</div>
    <h1>love u all </h1>
    <p>meow✦</p>
</div>

<script>
function createParticle() {
    const particle = document.createElement("div");
    particle.className = "particle";

    const size = Math.random() * 5 + 2;

    particle.style.width = size + "px";
    particle.style.height = size + "px";
    particle.style.left = Math.random() * 100 + "vw";
    particle.style.animationDuration =
        Math.random() * 5 + 4 + "s";

    document.body.appendChild(particle);

    setTimeout(() => {
        particle.remove();
    }, 9000);
}

setInterval(createParticle, 100);
</script>

</body>
</html>
